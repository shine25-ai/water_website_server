name: Deploy Nallathangal Backend

on:
  push:
    branches:
      - development

jobs:
  deploy-backend:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # Checkout
      # ==========================================
      - name: Checkout backend
        uses: actions/checkout@v4


      # ==========================================
      # Node
      # ==========================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 23
          cache: npm


      # ==========================================
      # Install dependencies
      # ==========================================
      - name: Install dependencies
        run: npm ci


      # ==========================================
      # Build backend
      # ==========================================
      - name: Build backend
        run: npm run build


      # ==========================================
      # Check build
      # ==========================================
      - name: Check build files
        run: |
          echo "Current directory:"
          pwd

          echo "Files:"
          ls -lah

          echo "dist-server:"
          ls -lah dist-server

          test -f dist-server/server.js


      # ==========================================
      # Upload backend
      # ==========================================
      - name: Upload backend
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST1 }}
          username: ${{ secrets.SERVER_USER1 }}
          key: ${{ secrets.SERVER_SSH_KEY1 }}
          source: "dist-server,package.json,package-lock.json"
          target: "/root/nallathangal/water_website_server"
          overwrite: true


      # ==========================================
      # Install dependencies + restart
      # ==========================================
      - name: Deploy and restart backend
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST1 }}
          username: ${{ secrets.SERVER_USER1 }}
          key: ${{ secrets.SERVER_SSH_KEY1 }}

          script: |
            set -e

            echo "======================================"
            echo "Loading NVM"
            echo "======================================"

            export NVM_DIR="$HOME/.nvm"

            if [ -s "$NVM_DIR/nvm.sh" ]; then
              source "$NVM_DIR/nvm.sh"
            fi

            echo "Node:"
            node -v

            echo "NPM:"
            npm -v

            echo "PM2:"
            pm2 -v


            echo "======================================"
            echo "Backend directory"
            echo "======================================"

            cd /root/nallathangal/water_website_server

            pwd
            ls -lah


            echo "======================================"
            echo "Installing dependencies"
            echo "======================================"

            npm ci --omit=dev


            echo "======================================"
            echo "Checking build"
            echo "======================================"

            test -f dist-server/server.js

            ls -lah dist-server


            echo "======================================"
            echo "Restarting backend"
            echo "======================================"

            if pm2 describe nallathangal-backend > /dev/null 2>&1; then

              pm2 restart nallathangal-backend

            else

              pm2 start dist-server/server.js \
                --name nallathangal-backend

            fi


            echo "======================================"
            echo "Saving PM2"
            echo "======================================"

            pm2 save


            echo "======================================"
            echo "Waiting for backend"
            echo "======================================"

            sleep 5


            echo "======================================"
            echo "PM2 status"
            echo "======================================"

            pm2 status


            echo "======================================"
            echo "Testing API"
            echo "======================================"

            curl -f http://127.0.0.1:5015/api/health

            echo ""
            echo "======================================"
            echo "DEPLOYMENT SUCCESSFUL"
            echo "======================================"