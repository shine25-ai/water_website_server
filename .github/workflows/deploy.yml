name: Deploy Backend

on:
  push:
    branches:
      - development

jobs:
  deploy-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 23
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build backend
        run: npm run build

      - name: Upload backend to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST1 }}
          username: ${{ secrets.SERVER_USER1 }}
          key: ${{ secrets.SERVER_SSH_KEY1 }}
          source: "dist-server/**,package.json,package-lock.json"
          target: "/root/nallathangal/water_website_server"
          strip_components: 0

      - name: Install modules and restart backend
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST1 }}
          username: ${{ secrets.SERVER_USER1 }}
          key: ${{ secrets.SERVER_SSH_KEY1 }}
          script: |
            set -e

            cd /root/nallathangal/water_website_server

            echo "Installing/updating backend dependencies..."
            npm ci --omit=dev

            echo "Checking build..."
            ls -lah dist-server

            echo "Restarting backend..."
            pm2 restart nallathangal-backend

            echo "Waiting for backend..."
            sleep 3

            echo "Checking backend..."
            curl -f http://127.0.0.1:5015/api/health

            echo ""
            echo "Backend deployment successful!"
